{# ── Create Workspace Modal ────────────────────────────── #}
<div class="modal fade" id="createWorkspaceModal" tabindex="-1" aria-labelledby="createWorkspaceModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--bg-toast); border:1px solid var(--border);">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="createWorkspaceModalLabel" style="color:var(--text-primary);">
          <i class="bi bi-people-fill me-2" style="color:var(--primary-light);"></i>New Workspace
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style="padding-top: 16px;">
        <div class="mb-3">
          <label for="modal-new-workspace-name" class="form-label" style="font-size:13px; color:var(--text-secondary);">Workspace Name</label>
          <input type="text" class="form-control" id="modal-new-workspace-name" placeholder="e.g. Marketing Team"
                 autocomplete="off" style="background:var(--bg-card); border-color:var(--border); color:var(--text-primary);">
        </div>
      </div>
      <div class="modal-footer border-top-0 pt-0">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="confirmCreateWorkspaceBtn">
          <span id="createWorkspaceBtnText">Create</span>
          <span id="createWorkspaceBtnLoader" style="display:none; align-items:center; gap:8px;">
            <span class="spinner-border spinner-border-sm" style="width:14px;height:14px;border-width:2px;"></span>
            Creating…
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
