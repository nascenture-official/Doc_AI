{% extends "base_app.html" %}
{% load static %}

{% block title %}{{ page_title }} — DocChat{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid px-0">
  <div class="card" style="background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg);">
    <div class="card-header d-flex justify-content-between align-items-center" style="border-bottom:1px solid var(--border); padding: 20px 24px;">
      <h4 class="mb-0" style="font-weight: 600; font-size: 18px; color: var(--text-primary);">{{ page_title }}</h4>
      <div class="d-flex gap-2">
        <a href="{% url 'documents:folder_manage' %}" class="btn btn-outline-secondary">Close</a>
        <button type="submit" form="folder-form" class="btn btn-primary">Submit</button>
      </div>
    </div>
    <div class="card-body" style="padding: 24px;">
      <form id="folder-form" method="POST">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label" style="color:var(--text-secondary); font-size: 14px;">Name<span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" style="background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);" value="{{ folder.name|default:'' }}" required>
        </div>
        <div class="mb-4">
          <label class="form-label" style="color:var(--text-secondary); font-size: 14px;">Parent Folder</label>
          <select name="parent_id" class="form-select" style="background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);">
            <option value="">---------</option>
            {% for parent in parents %}
              <option value="{{ parent.pk }}" {% if folder.parent_id == parent.pk %}selected{% endif %}>{{ parent.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label" style="color:var(--text-secondary); font-size: 14px;">Description</label>
          <textarea name="description" class="form-control" rows="6" style="background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary);">{{ folder.description|default:'' }}</textarea>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
