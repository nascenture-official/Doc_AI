{% extends "base_auth.html" %}

{% block title %}Email Sent — DocChat{% endblock %}

{% block auth_content %}
  <div class="text-center py-3">
    <div style="font-size:56px;margin-bottom:20px;">📬</div>
    <h2 class="auth-card-title">Check your inbox!</h2>
    <p class="auth-card-sub">
      We've emailed you a link to reset your password.<br>
      The link expires in 24 hours.
    </p>

    <div class="alert alert-info text-start mt-4" role="alert" style="font-size:13.5px;">
      <i class="bi bi-info-circle-fill me-2"></i>
      Didn't receive it? Check your spam folder, or
      <a href="{% url 'account_reset_password' %}" class="fw-semibold">try again</a>.
    </div>

    <a href="{% url 'account_login' %}" class="btn-outline-custom w-100 mt-4">
      <i class="bi bi-arrow-left"></i> Back to Sign In
    </a>
  </div>
{% endblock %}
