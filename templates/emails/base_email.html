<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }
        .email-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .email-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .email-body {
            padding: 40px 30px;
        }
        .email-body h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 16px;
        }
        .email-body p {
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.8;
        }
        .email-body a {
            color: #667eea;
            text-decoration: none;
        }
        .email-body a:hover {
            text-decoration: underline;
        }
        .cta-button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin: 24px 0;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .email-footer {
            background-color: #f9f9f9;
            padding: 20px 30px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        .email-footer p {
            margin: 4px 0;
        }
        .highlight {
            background-color: #f0f4ff;
            padding: 16px;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            margin: 16px 0;
        }
        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 24px 0;
        }
        .warning {
            background-color: #fff3cd;
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #ffc107;
            margin: 16px 0;
            font-size: 13px;
            color: #856404;
        }
        .success {
            background-color: #d4edda;
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #28a745;
            margin: 16px 0;
            font-size: 13px;
            color: #155724;
        }
        .code-box {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            margin: 16px 0;
        }
        .social-links {
            text-align: center;
            margin-top: 20px;
        }
        .social-links a {
            display: inline-block;
            margin: 0 8px;
            color: #667eea;
            text-decoration: none;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #999;
        }
        .logo {
            font-weight: 700;
            font-size: 18px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="email-container">
        {% block header %}
        <div class="email-header">
            <div class="logo">DocChat</div>
        </div>
        {% endblock %}
        
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        
        {% block footer %}
        <div class="email-footer">
            <p>&copy; 2024 DocChat. All rights reserved.</p>
            <p><a href="https://example.com" style="color: #667eea; text-decoration: none;">Visit our website</a></p>
            <p style="margin-top: 12px; font-size: 11px;">
                <a href="https://example.com/unsubscribe" style="color: #999; text-decoration: none;">Unsubscribe</a> | 
                <a href="https://example.com/preferences" style="color: #999; text-decoration: none;">Preferences</a>
            </p>
        </div>
        {% endblock %}
    </div>
</body>
</html>
